aid: chamber
name: Chamber
description: >-
  Chamber is an AIOps control plane for enterprise AI infrastructure (Y
  Combinator W26, Seattle). Its always-on agent — Chambie — monitors, diagnoses,
  and automatically resolves GPU workload failures across AWS, GCP, Azure, and
  on-premise Kubernetes clusters, and optimizes utilization so ML teams can run
  more workloads on the same GPUs without manual intervention. Chamber ships a
  REST API, an official Python SDK (chamber-sdk), and a `chamber` CLI for
  submitting GPU workloads, querying capacity budgets and GPU-hour allocations,
  and reading GPU utilization / memory / temperature / power metrics, plus Slack
  and email integrations and Terraform modules for GPU-ready EKS and GKE
  clusters.
